[package]
name = "oof-plus-desktop"
version = "1.1.0-alpha.1"
description = "115+ 是一个基于 115 网盘开放平台的开源桌面客户端"
authors = ["lvzhenbo"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
incremental = true # 以较小的步骤编译您的二进制文件。

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true        # 启用链接时优化。
opt-level = "s"   # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic = "abort"   # 通过禁用 panic 处理程序来提高性能。
strip = true      # 确保移除调试符号。

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oof_plus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [
  "devtools",
  "protocol-asset",
  "tray-icon",
  "image-png",
] }
tauri-plugin-opener = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-http = "2.6.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-pinia = "5.0.2"
ali-oss-rs = "0.2.5"
fs4 = { version = "1.1.0", features = ["sync"] }
sha1 = "0.11.0"
# socks feature 让下载 / 更新代理支持 socks4 / socks5 协议。
reqwest = { version = "0.13.5", features = ["stream", "socks"] }
# ali-oss-rs 内部使用 reqwest 0.12 系列且关闭了默认 features；
# 这里通过重命名直接依赖给同一版本合并 socks feature（Cargo 会取各依赖方 features 的并集），
# 使上传代理同样支持 socks 协议。
reqwest-0-12 = { package = "reqwest", version = "0.12", features = [
  "socks",
], default-features = false }
futures-util = "0.3.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["v4"] }
log = "0.4.34"
tauri-plugin-log = "2.9.1"
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
skrifa = "0.47.0"
