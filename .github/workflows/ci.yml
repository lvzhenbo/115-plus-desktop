name: 'Build Tauri App'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # pnpm/setup 一步安装 pnpm 与 Node.js，并自动执行 pnpm install（工作区存在 package.json 时）
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Create .env.local file
        run: |
          if [ -f .env ]; then
            cp .env .env.local
          else
            touch .env.local
          fi
          echo "VITE_APP_ID=${{ secrets.APP_ID }}" >> .env.local
          echo "VITE_APP_KEY=${{ secrets.APP_KEY }}" >> .env.local
        shell: bash

      # MSI 与 RPM 都无法表达 semver 预发布版本号（如 1.1.0-alpha.1）：
      #   - MSI 因此回退到 NSIS；
      #   - RPM 的 version 字段不允许 `-`（该字符是 version 与 release 的分隔符），
      #     故预发布跳过 rpm，仅打包 deb 与 appimage（appimage 也是 Linux 端应用内更新的产物）。
      - name: Resolve bundle arguments
        id: bundle-args
        shell: bash
        run: |
          ARGS='${{ matrix.args }}'

          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            case '${{ matrix.platform }}' in
              windows-latest) ARGS='--bundles nsis' ;;
              ubuntu-latest) ARGS='--bundles deb,appimage' ;;
            esac
          fi

          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # CI 产物仅用于验证构建与下载，不用于应用内更新：
          # 通过 --config 关闭 updater 产物（.sig / latest.json），因此无需 TAURI_SIGNING_PRIVATE_KEY，
          # 在 PR 等没有 secrets 的场景下也能正常构建。
          args: ${{ steps.bundle-args.outputs.args }} --config src-tauri/tauri.ci.conf.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-${{ matrix.platform }}${{ matrix.args }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/nsis/*.exe
          if-no-files-found: ignore
